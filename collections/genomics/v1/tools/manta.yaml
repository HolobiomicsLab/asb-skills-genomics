evidence_spans:
- Manta 15 min / 6.5 Gb
- Performance was compared to the popular SV callers manta (9), delly (42), and lumpy (43)
- for example the PE caller Manta employs Bayesian inference using read fragments supporting an allele to estimate a likelihood, followed by manual filtering (9)
- on the nanopore data and Manta/Delly on the matched Illumina data
- could not be found in matching Illumina sequencing data (despite extensive variant calling using six different variant calling methods
