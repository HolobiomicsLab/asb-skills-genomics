evidence_spans:
- general-purpose sequence alignment tools such as BLAST [9], DALIGN [10], and minimap2 [11]
- GraphMap was the only mapper that exhibited BLAST-like sensitivity, while being orders of magnitude faster than BLAST
- using the Basic Local Alignment Search Tool (BLAST) Nucleotide Collection nr/nt provided by the National Center for Biotechnology Information.
- Key features include automated BLAST validation
- validated through BLAST (Altschul et al. 1990) searches against the selected reference genomes.
- BlastN (version 2.2.31)
- perform a BLAST search against an nt/nr database and filter out all contigs that align to non-human references.
- Each contig is used to for a BLAST search in the virus reference database.
- Contigs are matched to reference genomes from the backend database using BLAST
- The result from blasting the contigs against the database
- The resulting contigs are then blasted against the given database and a reference sequence is selected based on the highest bit-score
