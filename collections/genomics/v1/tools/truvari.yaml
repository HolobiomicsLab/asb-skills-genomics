evidence_spans:
- (absent — flagged as missing)
- On the HG002 Genome in a Bottle (GIAB) benchmark, Blackbird in hybrid mode demonstrated results comparable to state-of-the-art long-read tools
- The evaluation was carried out with Truvari (v3.2.0) [56], using GRCh37 as the reference genome.
- Truvari was employed to compare the detected SVs against the truth set, providing precision, recall, and F1‐score metrics
- Compared with previous simulators, NanoSimFormer also substantially reduces false positives in homopolymer and short tandem repeat regions.
- All assessment below uses truvari 4.2.2 with MAFFT for refinement.
- We use **truvari4.0.0** to perform benchmarking against the Genome in a Bottle (GIAB) gold standard set in a high confidence region.
- An SV benchmarking tool, Truvari (v4.0.0)30, was employed to compare the SV calls of each tool with the GIAB SV gold standard
