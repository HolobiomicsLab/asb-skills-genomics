evidence_spans:
- docker pull carlosfarkas/annotate_my_genomes:latest
- DOGME invokes seqspec inside the configured Docker/Apptainer image.
- A pre-built Docker image that bundles all dependencies, including Dorado, Samtools, Minimap2, Modkit, and Kallisto, is available.
- Install Docker (https://www.docker.com/products/docker-desktop/) and make sure the daemon is running when you want to run the tests locally.
- '- [Installation and dependencies for development](#installation-and-dependencies-for-development)'
- adopts Docker and Singularity container technologies, removing the need to install required software dependencies
- It includes containerization support via Docker and Singularity, ensuring ease of use, reproducibility, and portability.
- We recommend installing NanoSimFormer using the pre-built Docker image.
- docker pull chobits323/nano-sim:v1.1
- We recommend installing NanoSimFormer using the pre-built Docker image. Ensure you have Docker and the NVIDIA Container Toolkit installed
- as a [Docker container](https://hub.docker.com/r/davidebolo1993/tricolor)
- By default ViMOP uses docker (for setup see the installation tutorials).
- Docker containers grant independence from the host operating system.
- VirDetector can be installed with either Conda **or** Docker.
- If you are using VirDetector on a non-Linux based operating system, please use the Docker version.
- Run the CNNSplice container and mount the present working directory to the container using
- docker pull oluwadarelab/cnnsplice:latest
- CNNSplice can be run in a Docker-containerized environment locally on users computer.
- or as an open‐source repository with Docker containers
