evidence_spans:
- We analyzed deletions in samples using SVIM, Sniffles, PBSV and cuteSV, using precision, recall and F1 score of the calling results as comparison metrics.
- 'Compared with four widely used genome structural variation calling tools: cuteSV, SVIM, Sniffles and PBSV'
- primarily employs methods like those used in the translocation detection section of CuteSV
- 'cuteSV: ‘–max_cluster_bias_INS 100 –diff_ratio_merging_INS 0.3 –max_cluster_bias_DEL 100 –diff_ratio_merging_DEL 0.3 –min_support = 1’'
- including NanoVar16, cuteSV17, pbsv18, Sniffles219, MAMnet20, SVDSS21, and DeBreak22
