evidence_spans:
- 'the Conda environment installs four MSA methods: [MAFFT](https://mafft.cbrc.jp/alignment/software/)'
- We test the utility of the ribosomal cluster for molecular taxonomy and phylogenetics across divergent plant and animal taxa
- All assessment below uses truvari 4.2.2 with MAFFT for refinement.
- you can choose between two different alignment tools, MAFFT or MUSCLE. While MAFFT is generally faster, MUSCLE is more precise but requires more computing resources.
