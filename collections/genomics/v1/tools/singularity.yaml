evidence_spans:
- the following cmd will cache the dafault singularity image (`--singularity_name` and/or `--clair3_singularity_name`)
- '### Example 1. Run with singularity (recommended)'
- conda install -c conda-forge singularity
- build the virtual environment using Singularity (v3.2.1 and above)
- adopts Docker and Singularity container technologies, removing the need to install required software dependencies
- It includes containerization support via Docker and Singularity, ensuring ease of use, reproducibility, and portability.
- Assessment is run in a truvari singularity image, so singularity will be required as well.
