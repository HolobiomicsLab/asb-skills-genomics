evidence_spans:
- you'll want to use the [ccs tool](https://ccs.how) to generate HiFi reads
- ccs sample_subreads.bam --report-file /outdir/sample_isoSeqccs_report.txt /outdir/sample_isoSeqccs.bam
- '[CCS](https://github.com/PacificBiosciences/ccs) generate a Circular Consensus Sequence from subreads.'
- ccs movieX.subreads.bam movieX.ccs.bam --noPolish --minPasses 1 &>ccs.log
- ccs movieX.subreads.bam movieX.ccs.bam --richQVs &>ccs.log
- ccs movieX.subreads.bam movieX.ccs.bam --noPolish --minPasses 1
