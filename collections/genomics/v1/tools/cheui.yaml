evidence_spans:
- We address this with CHEUI (CH3 (methylation) Estimation Using Ionic current).
- CHEUI-solo Model 2 is a binary classifier implemented as a CNN like for Model 1.
- Xpore, Nanocompore and CHEUI-diff were used to call differential RNA modifications on all A sites
- CHEUI-solo (Models 1 and 2) was run by pooling together three replicate samples from each cell line, WT and NSUN2-KO HeLa.
- We subjected TEST1 to two other methods that aim to detect m6A at single-molecule resolution (CHEUI and m6Anet)2,3
