evidence_spans:
- Aligning sequence reads, clone sequences and assembly contigs with BWA-MEM
- Fast-SG outperforms the state-of-the-art short-read aligners when building the scaffoldinggraph
- is comparable to BLAST and other mappers (BWA-MEM, LAST, BLASR and DALIGNER)
- We obtain read alignments using BWA-MEM29 with previously reported parameters15,16
- We obtain read alignments using BWA-MEM29 with previously reported parameters
- We obtain read alignments using BWA-MEM29 with previously reported parameters15,16 and mark positions with disagreements
- then aligned to an indexed plasmid reference file40 using BWA-MEM (bwa-0.7.17-r1188).
- bwa mem -x ont2d -t <num_threads> <reference>.fasta <filename>.fastq | samtools view -Sb - | samtools sort
- BWA-MEM (Li 2013) (v.0.7.15) and Rsamtools (Morgan et al. 2016) (v.1.34.1) were used to index, sort, and align the raw reads.
- bwa mem -t 10 -k11 -W20 -r10 -A1 -B1 -O1 -E1 -L0 -a -Y -K 3000
- We use BWA-MEM as the recommended aligner
- "We use BWA-MEM as the recommended aligner \nwith the fixed parameter set as follow"
- bwa mem -t 10 -k11 -W20 -r10 -A1 -B1 -O1 -E1 -L0 -a -Y Kp2146_spades.fasta Kp2146_ONT.fastq
- bwa mem -t 10 -k11 -W20 -r10 -A1 -B1 -O1 -E1 -L0 -a -Y
- 'We use BWA-MEM as the recommended aligner with the fixed parameter set as follow: bwa mem -k11 -W20 -r10 -A1 -B1 -O1 -E1 -L0 -a -Y'
- We used BWA MEM to align reads to seeds, but other aligners should work.
- Reads in fastq format are aligned using bwa‐mem (H. Li, 2013)
- predicted exons were aligned against their genomic reference with BWA MEM (Li, 2013), results were stored in BAM format with SAMTools
