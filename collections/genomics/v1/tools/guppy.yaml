name: Guppy
slug: guppy
version_used: 3.6.1
edam_topics: []
evidence_spans:
- -c dna_r10.4.1_e8.2_400bps_5khz_hac.cfg --bam_out --moves_out --recursive
- ${INPUT_DIR}/ont-guppy/bin/guppy_basecaller -i ${INPUT_DIR}/nanopore_raw_data
- the raw fast5 files should be basecalled by [Guppy (version>=3.6.1)]
- are required to basecall and re-squiggle the raw signals from nanopore reads before running deepsignal-plant
- Guppy (version>=3.6.1) is also required
- You can perform modified basecalling from the signal data using the `dna_r9.4.1_450bps_modbases_dam-dcm-cpg_hac.cfg` guppy config.
- Guppy provide a log-likelihood ratio value per site and per read.
- guppy_basecaller --config dna_r9.4.1_450bps_modbases_dam-dcm-cpg_hac.cfg
- Basecalling was performed using Guppy v4.4.2 with the “high accuracy” model.
- For compressing file.fastq using default 20 threads.
- '**Basecalling using guppy (v3.1.5)**'
- Fast5 files were basecalled with Guppy (v4.0.14)
- The installation includes the basecallers Guppy and Dorado.
