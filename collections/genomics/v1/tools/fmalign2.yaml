evidence_spans:
- We recommend installing **FMAlign2** with **conda**.
- FMAlign2 -i /path/to/input.fasta -o /path/to/output.fasta [other options]
- '-p <method|file>` (default: `mafft`). MSA backend — `mafft`, `clustalo`, `halign3`, or `halign4` — or a path to a custom MSA command file.'
- FMAlign2 leverages the suffix array to identify maximal exact matches, redefining the approach of FMAlign from searching for global chains to partial chains.
