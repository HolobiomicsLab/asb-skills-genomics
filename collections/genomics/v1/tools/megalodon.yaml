evidence_spans:
- methylation detection tools developed for the R9.4 platform, such as Tombo17, Megalodon18
- The basecalling-based methods, such as Megalodon28, directly call modified bases using an extended alphabet during basecalling22.
- We tested with Megalodon (v2.5.0), Guppy (v6.1.1, GPU on linux), Remora (v1.0.0).
- Similarly, for Megalodon we used the difference of the log-probabilities to obtain a log-ratio.
- Megalodon provided overall the best performance but relies on GPUs to be time efficient.
- Here we provide the training datasets of the three best performing tools (Nanopolish, DeepSignal, Megalodon)
- Here we used the most recent modified basecalling models in **Remora** that provides the most accurate methylation result.
- We highly recommend to use [Megalodon](https://github.com/nanoporetech/megalodon) (ONT-developed tool) coupled with Guppy for methylation calling
- Megalodon anchors the Guppy basecalling output to the reference and assigns a score for the candidate modified base
- many tools have been developed to call 5mC at CpG sites, like Nanopolish27, Megalodon32, Guppy33, DeepMod34, and Remora35
- only the ONT-provided computational tools Megalodon and Guppy are currently available to identify 6mAs in all possible contexts and 5mCs in CpG context
- Megalodon (v2.5.0) using model res_dna_r941_min_modbases-all-context_v001.cfg
- only the ONT-provided computational tools Megalodon and Guppy are currently available to identify 6mAs in all possible contexts
