evidence_spans:
- Figure 5 describes an IGV view of alignments (Thorvaldsdóttir et al. 2013)
- The left part of the figure uses IGV65,66 to visualize a multiple-alignment of the transcripts.
- The results can be visualized with, eg, IGV.
- The generated BAM files were viewed and analysed utilising Integrative Genomics Viewer (IGV v2.12.3)
- In this IGV plot, we can see that 5 CpG locations in the reads cannot be phased by SNV-based methods
- methylation information can be viewed in the BAM files or BigWig visualization tracks, for example in IGV.
- we manually investigated the candidate locus in the IGV Browser18
- the necessary files for browsing the alignment in the IGV genome browser
- we manually inspected the discordant TRs in the aligned contigs using IGV [31].
