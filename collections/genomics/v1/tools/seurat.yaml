evidence_spans:
- R-3.4.1 or later with `ggplot2 | gridExtra | grid | Seurat | DropletUtils`
- BiocManager::install('Seurat')
- 'BiocManager::install(''Seurat'')      # 3.2.0'
- We first identify the top N (default is 2000) variable genes in the reference expression profile matrix using the function 'FindVariableFeatures' of Seurat
- Cells are clustered at a resolution of 0.5 using Seurat's K-nearest-neighbor graph-based approach
- processed using R/Bioconductor (version 3.5.2) and the Seurat R package (version 3.1.4)
