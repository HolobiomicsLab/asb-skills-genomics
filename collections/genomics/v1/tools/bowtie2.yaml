evidence_spans:
- Fast-SG outperforms the state-of-the-art short-read aligners when building the scaffoldinggraph
- mapped to their respective Nanopore consensus sequences using bowtie2 (Bowtie, RRID:SCR_005476)
- For short-reads, we used Bowtie2 (Langmead and Salzberg 2012) to generate the mapping (BAM) files
- raw reads were mapped to the predicted exons with Bowtie2
- Finally, raw reads were mapped to the predicted exons with Bowtie2 (Langmead & Salzberg, 2012), and we performed SNP calling with BCFTools
