evidence_spans:
- PECAT corrects the raw reads with `corr_correct_options`.
- PECAT calls the heterozygous SNP sites based on the base frequency of the alignments
- PECAT (`asm1_assmeble_options`)  assembles the overlaps to haplotype-collapsed contigs.
- git clone --recursive https://github.com/lemene/PECAT.git
- PECAT follows the correct-then-assemble strategy, including an error correction module
- $ pecat.pl unzip cfgfile
- $ git clone --recursive https://github.com/lemene/PECAT.git
