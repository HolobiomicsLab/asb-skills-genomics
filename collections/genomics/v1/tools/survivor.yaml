evidence_spans:
- _No usage/docs found._
- Implant 1000 SURVIVOR inversions into GRCh37
- using the ‘simSV’ command of by SURVIVOR (version 1.0.6, https://github.com/fritzsedlazeck/SURVIVOR)
- SURVIVOR is a tool set for simulating/evaluating SVs, merging and comparing SVs within and among samples
- we applied a consensus approach to identify SVs (SURVIVOR), followed by rigorous filtering and manual inspection of all calls
- then used SURVIVOR (v1.0.6)36 to call somatic variants based on the paired normal-tumor VCFs
