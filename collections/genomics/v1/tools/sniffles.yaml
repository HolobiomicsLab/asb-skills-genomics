evidence_spans:
- We analyzed deletions in samples using SVIM, Sniffles, PBSV and cuteSV, using precision, recall and F1 score of the calling results as comparison metrics.
- 'Compared with four widely used genome structural variation calling tools: cuteSV, SVIM, Sniffles and PBSV'
- Performance was compared to the popular SV callers manta (9), delly (42), and lumpy (43)
- 'or Sniffles (v.1.0.9)28 with default parameters: ‘-s 2 -n -1 --genotype’ to detect SVs.'
- 'Sniffles: ‘–minsupport 1 –non-germline’'
- '## NanoSV'
- Run NanoSV, Lumpy, and Sniffles on public NA12878 MinION R9.4 chromosome 1 data
- plus Lumpy/Sniffles on the nanopore data and Manta/Delly on the matched Illumina data
